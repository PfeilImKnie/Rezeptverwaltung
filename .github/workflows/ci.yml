name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build, Format, Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore Rezeptverwaltung.slnx
      # NuGet-Audit: bekannte Schwachstellen brechen bereits das Restore/Build (Directory.Build.props).
      - run: dotnet format Rezeptverwaltung.slnx --verify-no-changes --no-restore
      - run: dotnet build Rezeptverwaltung.slnx -c Release --no-restore
      # Integrationstests starten PostgreSQL per Testcontainers (Docker ist auf dem Runner vorhanden).
      - run: >
          dotnet test --solution Rezeptverwaltung.slnx -c Release --no-build
          --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: tests/**/TestResults/coverage.cobertura.xml

  mutation:
    name: Mutation Testing (Domain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - name: Stryker je Domain-Testprojekt (Schwelle in stryker-config.json)
        run: |
          set -e
          for dir in tests/*.Domain.Tests; do
            echo "::group::$dir"
            (cd "$dir" && dotnet stryker)
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stryker-report
          path: tests/**/StrykerOutput/**/reports/

  api-vertrag:
    name: API-Vertrag (Schemathesis)
    runs-on: ubuntu-latest
    services:
      # Test-Aussteller für Tokens (ADR 0015); dieselbe Token-Form wie Zitadel.
      login:
        image: ghcr.io/navikt/mock-oauth2-server:6.1.4
        env:
          JSON_CONFIG: '{"interactiveLogin":false,"tokenCallbacks":[{"issuerId":"rezeptverwaltung","tokenExpiry":3600,"requestMappings":[{"requestParam":"scope","match":"inhaber-ci","claims":{"sub":"schemathesis","aud":["rezeptverwaltung-api"],"urn:zitadel:iam:org:project:roles":{"inhaber":{"betrieb-ci":"ci.test"}}}}]}]}'
        ports: ['8080:8080']
      postgres:
        image: docker.io/library/postgres:18-alpine
        env:
          POSTGRES_USER: rezeptverwaltung
          POSTGRES_PASSWORD: nur-fuer-ci
          POSTGRES_DB: rezeptverwaltung
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rezeptverwaltung"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ConnectionStrings__rezeptverwaltung: Host=127.0.0.1;Port=5432;Database=rezeptverwaltung;Username=rezeptverwaltung;Password=nur-fuer-ci
      Authentifizierung__Authority: http://localhost:8080/rezeptverwaltung
      Authentifizierung__Audience: rezeptverwaltung-api
      Authentifizierung__RequireHttpsMetadata: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install schemathesis
      - name: API starten
        run: |
          dotnet run --project src/Host/Rezeptverwaltung.Api -c Release --urls http://127.0.0.1:5080 > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:5080/health && exit 0
            sleep 2
          done
          cat api.log
          exit 1
      - name: Token holen
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/rezeptverwaltung/.well-known/openid-configuration > /dev/null && break
            sleep 2
          done
          TOKEN=$(curl -fsS -X POST http://localhost:8080/rezeptverwaltung/token \
            -d grant_type=client_credentials -d client_id=ci -d client_secret=ci -d scope=inhaber-ci \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['access_token'])")
          echo "::add-mask::$TOKEN"
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Schemathesis gegen api/openapi.yaml
        run: |
          st run api/openapi.yaml --url http://127.0.0.1:5080 --checks all -H "Authorization: Bearer $TOKEN"
      - name: API-Log
        if: failure()
        run: cat api.log

  pr-gate:
    name: PR-Gate (Test, Review, Doku, DoD)
    # Ausnahme (ADR 0010): reine Dependabot-Updates. Gilt nur, wenn der PR von Dependabot stammt UND der Lauf
    # von Dependabot ausgelöst wurde. Pusht ein Mensch auf den Branch oder bearbeitet die Beschreibung, greift das Gate.
    # Ein übersprungener Job zählt für den Branch-Schutz als bestanden.
    if: >-
      github.event_name == 'pull_request' &&
      !(github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: PR-Beschreibung prüfen (ADR 0007)
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          fehler=0
          pruefe() {
            if ! printf '%s' "$BODY" | grep -qF -- "$1"; then
              echo "::error::PR-Beschreibung: $2"
              fehler=1
            fi
          }
          pruefe "## Anforderung"         "Abschnitt '## Anforderung' fehlt."
          pruefe "## Unabhängiger Test"   "Abschnitt '## Unabhängiger Test' fehlt (Skill /pr-test)."
          pruefe "## Code-Review"         "Abschnitt '## Code-Review' fehlt (Skill /pr-review)."
          pruefe "**Ergebnis: Freigegeben**" "Code-Review ist nicht freigegeben."
          pruefe "## Dokumentation"       "Abschnitt '## Dokumentation' fehlt (Skill /adr)."
          if printf '%s' "$BODY" | grep -qE -- '^\s*- \[ \]'; then
            echo "::error::Definition of Done: offene Checkboxen. Abhaken oder als 'entfällt: <Grund>' markieren."
            fehler=1
          fi
          exit $fehler
